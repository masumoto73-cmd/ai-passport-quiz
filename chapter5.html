<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>第5章 テキスト生成AIのプロンプト制作と実例 復習チャット</title>
<style>
  :root{
    --bg:#f5f3ef;
    --card:#ffffff;
    --text:#3a3630;
    --sub:#8a8378;
    --orange:#e8792c;
    --orange-light:#fdece0;
    --bot-bubble:#ffffff;
    --user-bubble:#e8792c;
    --correct:#4c9a6a;
    --wrong:#d9534f;
    --border:#e6e1d8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;color:var(--text);}
  #app{max-width:480px;margin:0 auto;height:100vh;height:-webkit-fill-available;height:100dvh;display:flex;flex-direction:column;background:var(--bg);}

  header{
    background:var(--card);
    border-bottom:1px solid var(--border);
    padding:14px 16px;
    display:flex;
    align-items:center;
    gap:10px;
    flex-shrink:0;
  }
  header .avatar{
    width:36px;height:36px;border-radius:50%;
    background:var(--orange);
    color:#fff;display:flex;align-items:center;justify-content:center;
    font-weight:bold;font-size:15px;flex-shrink:0;
  }
  header .title{font-size:15px;font-weight:600;line-height:1.3;}
  header .sub{font-size:11px;color:var(--sub);}

  .level-bar{
    display:flex;
    gap:8px;
    padding:10px 14px;
    background:var(--bg);
    border-bottom:1px solid var(--border);
    flex-shrink:0;
  }
  .level-btn{
    flex:1;
    padding:9px 0;
    border-radius:20px;
    border:1.5px solid var(--border);
    background:var(--card);
    color:var(--sub);
    font-size:13px;
    font-weight:600;
    text-align:center;
  }
  .level-btn.active{
    background:var(--orange);
    border-color:var(--orange);
    color:#fff;
  }

  .top-nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:8px 12px;
    background:var(--bg);
    border-bottom:1px solid var(--border);
    flex-shrink:0;
    font-size:12.5px;
  }
  .top-nav a{
    color:var(--sub);
    text-decoration:none;
    padding:5px 9px;
    border-radius:8px;
  }
  .top-nav a:active{background:var(--orange-light);}
  .top-nav a.home{
    color:var(--orange);
    font-weight:700;
  }
  .top-nav a.disabled{
    visibility:hidden;
  }

  #chat{
    flex:1;
    overflow-y:auto;
    padding:16px 14px 90px 14px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .bubble-row{display:flex;gap:8px;align-items:flex-end;}
  .bubble-row.bot{justify-content:flex-start;}
  .bubble-row.user{justify-content:flex-end;}

  .mini-avatar{
    width:26px;height:26px;border-radius:50%;
    background:var(--orange);color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:bold;flex-shrink:0;
  }

  .bubble{
    max-width:78%;
    padding:10px 14px;
    border-radius:16px;
    font-size:14.5px;
    line-height:1.55;
    white-space:pre-wrap;
    box-shadow:0 1px 2px rgba(0,0,0,0.05);
  }
  .bot .bubble{
    background:var(--bot-bubble);
    border:1px solid var(--border);
    border-bottom-left-radius:4px;
  }
  .user .bubble{
    background:var(--user-bubble);
    color:#fff;
    border-bottom-right-radius:4px;
  }
  .bubble.correct{background:#eaf6ee;border:1px solid var(--correct);color:#2f6b46;}
  .bubble.wrong{background:#fdecea;border:1px solid var(--wrong);color:#a83a34;}
  .bubble.explain{background:var(--orange-light);border:1px solid #f3caa3;color:#7a4413;}
  .bubble .tag{
    display:inline-block;
    font-size:10.5px;
    font-weight:700;
    padding:2px 8px;
    border-radius:10px;
    margin-bottom:6px;
    background:var(--orange);
    color:#fff;
  }

  .choices{display:flex;flex-direction:column;gap:8px;margin-top:2px;padding-left:34px;}
  .choice-btn{
    text-align:left;
    padding:10px 14px;
    border-radius:12px;
    border:1.5px solid var(--border);
    background:var(--card);
    font-size:14px;
    color:var(--text);
  }
  .choice-btn:active{background:var(--orange-light);}
  .choice-btn:disabled{opacity:0.5;}

  .next-wrap{padding-left:34px;margin-top:2px;}
  .next-btn{
    padding:9px 20px;
    border-radius:20px;
    background:var(--orange);
    color:#fff;
    border:none;
    font-size:13.5px;
    font-weight:600;
  }

  #progress-wrap{
    position:sticky;
    bottom:0;
    background:linear-gradient(to top, var(--bg) 70%, transparent);
    padding:10px 14px 14px 14px;
    flex-shrink:0;
  }
  #progress-bar-bg{
    background:var(--border);
    border-radius:10px;
    height:8px;
    overflow:hidden;
  }
  #progress-bar-fg{
    background:var(--orange);
    height:100%;
    width:0%;
    transition:width 0.3s ease;
  }
  #progress-text{
    font-size:11.5px;
    color:var(--sub);
    margin-top:5px;
    text-align:center;
  }

  .result-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:20px;
    text-align:center;
    margin-left:34px;
  }
  .result-card .score{font-size:32px;font-weight:800;color:var(--orange);margin:6px 0;}
  .restart-btn{
    margin-top:12px;
    padding:10px 22px;
    border-radius:20px;
    background:var(--orange);
    color:#fff;
    border:none;
    font-size:14px;
    font-weight:600;
  }
  .home-link{
    display:inline-block;
    margin-top:14px;
    font-size:12.5px;
    color:var(--sub);
    text-decoration:underline;
  }
</style>
</head>
<body>
<div id="app">
  <div class="top-nav">
    <a href="chapter4.html">‹ 前の章</a>
    <a href="index.html" class="home">🏠 メニュー</a>
    <a href="#" class="disabled">次の章 ›</a>
  </div>
  <header>
    <div class="avatar">AI</div>
    <div>
      <div class="title">第5章 復習チャット</div>
      <div class="sub">テキスト生成AIのプロンプト制作と実例 ー 生成AIパスポート対策</div>
    </div>
  </header>

  <div class="level-bar">
    <div class="level-btn active" id="btn-basic">基礎レベル</div>
    <div class="level-btn" id="btn-advanced">応用レベル</div>
  </div>

  <div id="chat"></div>

  <div id="progress-wrap">
    <div id="progress-bar-bg"><div id="progress-bar-fg"></div></div>
    <div id="progress-text">0 / 0 問</div>
  </div>
</div>

<script>
const QUESTIONS = {
  basic: [
    {q:"ある文章が自然言語としてどれだけ自然かを評価する数学的モデルを何と呼ぶ？", choices:["LM(言語モデル)","LLM","RAG","MCP"], answer:0,
     explain:"LMは単語や文の並びに着目し、文章が自然言語としてどれだけ自然かを評価する確率モデルです。"},
    {q:"数十億以上のパラメータを持つ、非常に大規模な自然言語処理モデルを何と呼ぶ？", choices:["LLM(大規模言語モデル)","n-gramモデル","VAE","CNN"], answer:0,
     explain:"LLMは大量のテキストデータで学習され、プレトレーニングとファインチューニングの2段階で高い精度を実現します。"},
    {q:"大量のテキストデータから自然言語の知識を獲得する学習方法を何と呼ぶ？", choices:["プレトレーニング","ファインチューニング","ハイパーパラメータ調整","ゼロショット"], answer:0,
     explain:"プレトレーニングは教師なし学習を用いて、大量のラベルの無いテキストデータからパターンを発見させます。"},
    {q:"Temperatureパラメータを1に近づけると出力はどうなる？", choices:["ランダム性が高くなる","結果が一意に定まりやすくなる","文字数が正確になる","計算精度が上がる"], answer:0,
     explain:"Temperatureが1に近いほどランダム性の高い回答が選ばれ、創造的なタスクで効果的な場合があります。"},
    {q:"例文を一切示さず、質問をそのまま入力する最もシンプルなプロンプティング手法は？", choices:["Zero-Shotプロンプティング","Few-Shotプロンプティング","ファインチューニング","RAG"], answer:0,
     explain:"Zero-Shotプロンプティングは例示が0個で、簡単なタスクには有効ですが複雑なタスクでは信頼性が下がることがあります。"},
    {q:"例文を2、3個示してから質問することで、より望ましい回答を得る手法は？", choices:["Few-Shotプロンプティング","Zero-Shotプロンプティング","プレトレーニング","RAG"], answer:0,
     explain:"Few-Shotプロンプティングは、生成AIがプロンプト内の例文を学習して出力する性質を利用した手法です。"},
    {q:"プロンプトを構成する4要素、Instruction・Context・Input Data ともう1つは？", choices:["Output Indicator(出力指示)","Temperature","Fine-tuning","Embedding"], answer:0,
     explain:"Output Indicatorは、AIの出力がどのような形式であるべきかを示す要素です。"},
    {q:"「あなたはプロのマーケターです」という一文は、プロンプトの4要素のうちどれに当たる？", choices:["Context(文脈)","Instruction(命令)","Input Data(入力データ)","Output Indicator(出力指示)"], answer:0,
     explain:"Contextはプロンプトの背景情報を示す要素で、役割や立場を設定する際に使われます。"},
    {q:"「事実とは異なる内容をあたかも本当のことかのように出力する」現象を何と呼ぶ？", choices:["ハルシネーション","ファインチューニング","アライメント","エンベッディング"], answer:0,
     explain:"ハルシネーションは「もっともらしいウソ」と訳され、Zero-Shotプロンプティングでも起こりうる問題です。"},
    {q:"文章を「10歳の小学生でもわかるように」変換するテクニックは何を変更する方法か？", choices:["読み手(対象)の設定","話者の設定","出力形式の指定","文字数の指定"], answer:0,
     explain:"読み手を設定して出力を操作する方法で、専門用語の多い文章の読解にも役立ちます。"},
    {q:"「あなたはプロのデータサイエンティストです」と設定するのは何を変更するテクニックか？", choices:["話者の設定","読み手の設定","出力形式の指定","言語の指定"], answer:0,
     explain:"話し手の人物像を設定することで、専門的な立場からの出力を得ることができます。"},
    {q:"テキスト生成AIが不得意とされることに含まれないものは？", choices:["簡単な質問への回答","正確な文字数の指定","計算","最新の情報の提供"], answer:0,
     explain:"簡単な質問への回答は得意な分野です。文字数指定・計算・最新情報・芸術の批評は不得意とされています。"},
  ],
  advanced: [
    {q:"テキスト内のn個の連続する単語の出現頻度を数え上げて予測を行うモデルは？", choices:["n-gramモデル","ニューラル言語モデル","LLM","Transformer"], answer:0,
     explain:"n-gramモデルは高速処理が可能な反面、文脈や単語の順序を考慮すべきタスクでは性能が劣ります。"},
    {q:"ファインチューニングの3ステップに含まれないものは？", choices:["エンベッディングの生成","モデルのトレーニング","ハイパーパラメータの調整","モデルの評価"], answer:0,
     explain:"ファインチューニングは、モデルのトレーニング→ハイパーパラメータ調整→モデルの評価、という3ステップで行われます。"},
    {q:"Top-pパラメータの働きとして正しいものは？", choices:["出力生成のランダム性を制御する","文字数を正確に指定する","計算精度を上げる","最新情報を検索する"], answer:0,
     explain:"Top-pはTemperatureと同様に出力のランダム性を制御し、低くすると可能性の高いワードが選ばれます。"},
    {q:"プロンプトエンジニアリングの主な目的は？", choices:["AIから最適な結果を得るための指示や質問を設計すること","AIのパラメータ数を増やすこと","AIの学習データを増やすこと","AIのハルシネーションを完全に無くすこと"], answer:0,
     explain:"プロンプトエンジニアリングは、AIへの指示や質問(プロンプト)を設計し最適な結果を得るための技術です。"},
    {q:"要約したい文章が長すぎてエラーが返される場合の対処法は？", choices:["適切な文章量で区切り、複数回に分けて入力する","Temperatureを0にする","Few-Shotを使わない","文字数指定を諦める"], answer:0,
     explain:"文章が長すぎる場合は、適切な量で区切り複数回に渡り小分けにして入力することでエラーを解消できます。"},
    {q:"タスクの抽出をメールから行った後、続けて別の指示を出す際の利点は？", choices:["メールの原文を再入力する必要がない","毎回原文の再入力が必須になる","出力形式が固定される","ハルシネーションが増える"], answer:0,
     explain:"文脈を保持したまま次々とタスクを進められるため、原文を繰り返し入力する必要がありません。"},
    {q:"インターネット情報をリアルタイムで検索し、最新のトピックに対応できる生成AIとして紹介されているのは？", choices:["Perplexity AI","GPT-3.5","BERT","n-gramモデル"], answer:0,
     explain:"Perplexity AIはインターネット情報をリアルタイムで検索するため、GPT系が不得意とする最新情報への対応を克服しています。"},
    {q:"プロンプトに個人情報を含める際に推奨される対策は？", choices:["架空の情報に置き換えて入力する","本名をそのまま使う","住所を詳細に書く","会社名を実名で書く"], answer:0,
     explain:"プロンプトとして入力する個人情報は、架空の情報へ置き換えることでセキュリティを担保できます。"},
    {q:"GPT-3.5が「2023×510」の計算で誤った回答を出す例が示す不得意分野は？", choices:["計算","翻訳","要約","文章の校正"], answer:0,
     explain:"GPT-3.5は計算が不得意とされ、桁数の大きい掛け算などで誤った回答を出すことがあります。"},
    {q:"質問させながら一緒に進める対話型のプロンプティングの利点は？", choices:["AIが質問しながら情報を引き出し、段階的にタスクを整理できる","一度の指示で全てが完結する","文字数指定が正確になる","計算が正確になる"], answer:0,
     explain:"AIに質問をさせながら回答することで、新製品開発のロードマップ作成のように段階的にタスクを整理できます。"},
    {q:"ニューラル言語モデルがn-gramモデルより優れている点は？", choices:["文脈を考慮した自然なテキスト生成ができる","計算負荷が小さい","処理速度が常に速い","出現頻度のみで判断する"], answer:0,
     explain:"ニューラル言語モデルは大規模コーパスを学習し文脈を考慮できますが、その分処理能力の負荷は大きくなります。"},
    {q:"ビジネス応用のプロンプトでメール文を作成する際の注意点として正しいものは？", choices:["機密情報や個人情報を含めないよう確認する","できるだけ詳細な実名を書く","AIの出力をそのまま送信する","誤訳の確認は不要である"], answer:0,
     explain:"作成したメール文章に機密情報・個人情報が含まれていないか確認し、最終的に人間の手で修正することが重要です。"},
  ]
};

let level = "basic";
let idx = 0;
let correctCount = 0;
let answered = false;

const chatEl = document.getElementById('chat');
const progressFg = document.getElementById('progress-bar-fg');
const progressText = document.getElementById('progress-text');
const btnBasic = document.getElementById('btn-basic');
const btnAdvanced = document.getElementById('btn-advanced');

function scrollToBottom(){
  requestAnimationFrame(()=>{ chatEl.scrollTop = chatEl.scrollHeight; });
}

function addBotBubble(html, extraClass){
  const row = document.createElement('div');
  row.className = 'bubble-row bot';
  row.innerHTML = `<div class="mini-avatar">AI</div><div class="bubble ${extraClass||''}">${html}</div>`;
  chatEl.appendChild(row);
  scrollToBottom();
  return row;
}

function addUserBubble(text){
  const row = document.createElement('div');
  row.className = 'bubble-row user';
  row.innerHTML = `<div class="bubble">${text}</div>`;
  chatEl.appendChild(row);
  scrollToBottom();
}

function updateProgress(){
  const list = QUESTIONS[level];
  const pct = Math.round((idx/list.length)*100);
  progressFg.style.width = pct + '%';
  progressText.textContent = `${idx} / ${list.length} 問　(正解 ${correctCount})`;
}

function startLevel(newLevel){
  level = newLevel;
  idx = 0;
  correctCount = 0;
  answered = false;
  chatEl.innerHTML = '';
  btnBasic.classList.toggle('active', level==='basic');
  btnAdvanced.classList.toggle('active', level==='advanced');
  addBotBubble(`<span class="tag">${level==='basic'?'基礎レベル':'応用レベル'}</span><br>第5章「テキスト生成AIのプロンプト制作と実例」の復習を始めましょう。全${QUESTIONS[level].length}問です。`);
  updateProgress();
  setTimeout(showQuestion, 400);
}

function showQuestion(){
  const list = QUESTIONS[level];
  if(idx >= list.length){
    showResult();
    return;
  }
  answered = false;
  const item = list[idx];
  addBotBubble(`<b>Q${idx+1}.</b> ${item.q}`);

  const row = document.createElement('div');
  row.className = 'bubble-row bot';
  const choicesHtml = document.createElement('div');
  choicesHtml.className = 'choices';
  item.choices.forEach((c, i)=>{
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = c;
    btn.onclick = ()=> selectChoice(i, btn, row);
    choicesHtml.appendChild(btn);
  });
  row.innerHTML = '<div class="mini-avatar" style="visibility:hidden"></div>';
  row.appendChild(choicesHtml);
  chatEl.appendChild(row);
  scrollToBottom();
}

function selectChoice(i, btn, row){
  if(answered) return;
  answered = true;
  const list = QUESTIONS[level];
  const item = list[idx];
  const allBtns = row.querySelectorAll('.choice-btn');
  allBtns.forEach(b=>b.disabled = true);

  addUserBubble(btn.textContent);

  const isCorrect = i === item.answer;
  if(isCorrect) correctCount++;

  const resultLabel = isCorrect ? '正解です！' : `不正解 (正解: ${item.choices[item.answer]})`;
  addBotBubble(resultLabel, isCorrect ? 'correct' : 'wrong');
  addBotBubble(`<span class="tag">解説</span><br>${item.explain}`, 'explain');

  const nextWrap = document.createElement('div');
  nextWrap.className = 'next-wrap';
  const nextBtn = document.createElement('button');
  nextBtn.className = 'next-btn';
  nextBtn.textContent = (idx+1 < list.length) ? '次の問題へ →' : '結果を見る →';
  nextBtn.onclick = ()=>{
    idx++;
    updateProgress();
    nextWrap.remove();
    setTimeout(showQuestion, 200);
  };
  nextWrap.appendChild(nextBtn);
  chatEl.appendChild(nextWrap);
  scrollToBottom();
}

function showResult(){
  updateProgress();
  const list = QUESTIONS[level];
  const pct = Math.round((correctCount/list.length)*100);
  const card = document.createElement('div');
  card.className = 'result-card';
  card.innerHTML = `
    <div style="font-size:14px;color:var(--sub);">お疲れさまでした！</div>
    <div class="score">${correctCount} / ${list.length} 問正解</div>
    <div style="font-size:13px;color:var(--sub);">正答率 ${pct}%</div>
    <button class="restart-btn" id="restart">もう一度挑戦する</button>
    <div><a class="home-link" href="./">章選択に戻る</a></div>
  `;
  chatEl.appendChild(card);
  document.getElementById('restart').onclick = ()=> startLevel(level);
  scrollToBottom();
}

btnBasic.onclick = ()=> { if(level!=='basic') startLevel('basic'); };
btnAdvanced.onclick = ()=> { if(level!=='advanced') startLevel('advanced'); };

startLevel('basic');
</script>
</body>
</html>
